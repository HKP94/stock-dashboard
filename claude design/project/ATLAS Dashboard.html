<style>
  @font-face {
    font-family: "Pretendard Variable";
    src: url("fonts/PretendardVariable.ttf") format("truetype-variations");
    font-weight: 45 920; font-style: normal; font-display: swap;
  }
  @import url("https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap");

  :root {
    --sans: "Pretendard Variable", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    --mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    --serif: "Instrument Serif", Georgia, serif;
    --surface2: #F4F6F8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: #FAFBFC; color: #0F1419;
    font-family: var(--sans); font-size: 15px; line-height: 1.55;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    font-feature-settings: "tnum", "lnum";
  }
  .mono { font-family: var(--mono); }
  .tnum { font-feature-settings: "tnum", "lnum"; font-variant-numeric: tabular-nums; }
  ::selection { background: rgba(42,91,255,0.12); }

  .row-hover { transition: background .13s; }
  .row-hover:hover { background: var(--surface2); }
  .chip-hover:hover { border-color: #2A5BFF !important; color: #2A5BFF !important; }

  table { font-variant-numeric: tabular-nums; }
  button { font-family: var(--sans); }
  input, textarea, select { font-family: var(--sans); }
  input:focus, textarea:focus, select:focus { border-color: #2A5BFF !important; box-shadow: 0 0 0 3px rgba(42,91,255,0.08); }

  /* thin scrollbars */
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: #DDE1E6; border-radius: 999px; border: 2px solid #FAFBFC; }
  ::-webkit-scrollbar-thumb:hover { background: #C7CCD3; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
