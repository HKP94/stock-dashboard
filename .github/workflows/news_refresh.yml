name: ATLAS 가격·뉴스 리프레시 (18:00 KST)

# 하루 2회 갱신. 06:00 전체 파이프라인(auto_run.yml)에 더해 18:00에
# 경량 가격 갱신(prices_daily+indicators/quant) + 뉴스 수집 + Gemini 요약(+시황) + export.
# (PR-1) 18:00은 KR 장마감 후라 KR 당일 종가를 확보. 재무/밸류/컨센서스 수집은 06:00에서만.

on:
  workflow_dispatch:   # 수동 실행
  schedule:
    # KST 18:00 = UTC 09:00
    - cron: '0 9 * * *'

jobs:
  news_refresh:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.12 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 뉴스 수집 + 요약 + export
        env:
          DB_HOST:            aws-1-ap-northeast-2.pooler.supabase.com
          DB_PORT:            "6543"
          DB_USER:            postgres.dpegnpmzgozvcvbqmnlt
          DB_PASSWORD:        ${{ secrets.DB_PASSWORD }}
          DB_NAME:            postgres
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BULK_MODEL:  gemini-2.5-flash-lite
          GEMINI_SYNTH_MODEL: gemini-2.5-flash
        run: |
          python -m src.news_refresh
