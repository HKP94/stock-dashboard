name: ATLAS 한국 종가 기준 경량 갱신 (18:00 KST)

# 하루 2회 갱신. 06:00 전체 파이프라인(auto_run.yml)에 더해 18:00에
# 경량 가격 갱신(prices_daily+indicators/quant) + 뉴스 수집 + Gemini 요약(+시황) + export.
# (PR-1) 18:00은 KR 장마감 후라 KR 당일 종가를 확보. 재무/밸류/컨센서스 수집은 06:00에서만.

on:
  workflow_dispatch:   # 수동 실행
    inputs:
      engine:
        description: '실행 엔진 — split=새 3실행기+export(기본·cron), legacy=기존 news_refresh(롤백용 수동 전용).'
        type: choice
        options:
          - split
          - legacy
        default: split
  schedule:
    # KST 18:00 = UTC 09:00
    - cron: '0 9 * * *'

jobs:
  news_refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # 7-A: split step들이 상속할 공용 env(legacy step은 자체 inline env를 그대로 유지).
    #      DB_HOST/PORT/USER/NAME은 접속 정보, 비밀(PASSWORD/KEY)은 GitHub Secrets에서만.
    env:
      DB_HOST:            aws-1-ap-northeast-2.pooler.supabase.com
      DB_PORT:            "6543"
      DB_USER:            postgres.dpegnpmzgozvcvbqmnlt
      DB_PASSWORD:        ${{ secrets.DB_PASSWORD }}
      DB_NAME:            postgres
      GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
      GEMINI_BULK_MODEL:  gemini-2.5-flash-lite
      GEMINI_SYNTH_MODEL: gemini-2.5-flash
      GEMINI_HTTP_TIMEOUT_MS: "45000"
      GEMINI_BATCH_BUDGET_SECONDS: "1200"

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.12 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── legacy 경로(롤백 전용). engine=legacy로 수동 실행할 때만 — cron/기본(split)은 안 돈다.
      - name: 뉴스 수집 + 요약 + export
        if: ${{ github.event.inputs.engine == 'legacy' }}
        env:
          DB_HOST:            aws-1-ap-northeast-2.pooler.supabase.com
          DB_PORT:            "6543"
          DB_USER:            postgres.dpegnpmzgozvcvbqmnlt
          DB_PASSWORD:        ${{ secrets.DB_PASSWORD }}
          DB_NAME:            postgres
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BULK_MODEL:  gemini-2.5-flash-lite
          GEMINI_SYNTH_MODEL: gemini-2.5-flash
          GEMINI_HTTP_TIMEOUT_MS: "45000"
          GEMINI_BATCH_BUDGET_SECONDS: "1200"
        run: |
          python -m src.news_refresh

      # ── split 경로(7-B: cron·기본 경로). engine!=legacy일 때 실행 — cron은 inputs.engine이 비어 여기로.
      #    설계 §7 18시 순서. 분석→종합 순서 유지 후 export. step 분리로 실패 가시화.
      - name: (split) 수집 refresh
        if: ${{ github.event.inputs.engine != 'legacy' }}
        run: python -m src.pipeline_ingest --profile refresh

      - name: (split) 분석 refresh
        if: ${{ github.event.inputs.engine != 'legacy' }}
        run: python -m src.pipeline_analysis --profile refresh

      - name: (split) 종합 refresh
        if: ${{ github.event.inputs.engine != 'legacy' }}
        run: python -m src.pipeline_synthesis --profile refresh

      - name: (split) export data.json
        if: ${{ github.event.inputs.engine != 'legacy' }}
        run: python -m src.export_dashboard_data
