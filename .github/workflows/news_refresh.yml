name: ATLAS 뉴스 리프레시 (18:00 KST)

# PR-2: 하루 2회 뉴스 수집. 06:00 전체 파이프라인(auto_run.yml)에 더해
# 18:00에 뉴스 수집 + Gemini 요약(+시황) + data.json export만 가볍게 돈다.
# 가격/지표/퀀트 재계산은 생략(이미 06:00에 수행).

on:
  workflow_dispatch:   # 수동 실행
  schedule:
    # KST 18:00 = UTC 09:00
    - cron: '0 9 * * *'

jobs:
  news_refresh:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.12 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 뉴스 수집 + 요약 + export
        env:
          DB_HOST:            aws-1-ap-northeast-2.pooler.supabase.com
          DB_PORT:            "6543"
          DB_USER:            postgres.dpegnpmzgozvcvbqmnlt
          DB_PASSWORD:        ${{ secrets.DB_PASSWORD }}
          DB_NAME:            postgres
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BULK_MODEL:  gemini-2.5-flash-lite
          GEMINI_SYNTH_MODEL: gemini-3.5-flash
        run: |
          python -m src.news_refresh
