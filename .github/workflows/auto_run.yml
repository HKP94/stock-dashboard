name: 주식 분석 파이프라인 정기 실행

on:
  workflow_dispatch: # 언제든 수동으로도 돌릴 수 있게 유지
  schedule:
    # 한국 시간(KST) 오전 6시 = 영국 시간(UTC) 전날 밤 9시(21시)
    # 분 시 일 월 요일 순서입니다.
    - cron: '0 21 * * *' 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 내 코드 저장소 가져오기
      uses: actions/checkout@v5

    - name: 2. 파이썬 환경 세팅하기
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: 3. 필요한 라이브러리 설치하기
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. 파이썬 코드(main.py) 실행하기
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      run: python main.py
