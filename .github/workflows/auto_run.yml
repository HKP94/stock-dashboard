name: ATLAS 일일 파이프라인 (06:00 KST)

on:
  workflow_dispatch:   # 수동 실행 유지
  schedule:
    # KST 06:00 = UTC 21:00 (전날)
    - cron: '0 21 * * *'

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.12 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 파이프라인 실행 (수집 → 연산 → LLM → 조립)
        env:
          DB_HOST:            aws-1-ap-northeast-2.pooler.supabase.com
          DB_PORT:            "6543"
          DB_USER:            postgres.dpegnpmzgozvcvbqmnlt
          DB_PASSWORD:        ${{ secrets.DB_PASSWORD }}
          DB_NAME:            postgres
          DART_API_KEY:       ${{ secrets.DART_API_KEY }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BULK_MODEL:  gemini-2.5-flash-lite
          GEMINI_SYNTH_MODEL: gemini-2.5-flash
        run: python -m src.run_pipeline

      # PR-1: 텔레그램 브리핑 보류(비활성). 살리려면 아래 step 주석 해제 +
      #       env에 TELEGRAM_ENABLED: "true" 추가 + repo secrets에 봇토큰/챗ID 등록.
      # - name: 텔레그램 브리핑 발송
      #   env:
      #     DB_HOST:              aws-1-ap-northeast-2.pooler.supabase.com
      #     DB_PORT:              "6543"
      #     DB_USER:              postgres.dpegnpmzgozvcvbqmnlt
      #     DB_PASSWORD:          ${{ secrets.DB_PASSWORD }}
      #     DB_NAME:              postgres
      #     TELEGRAM_ENABLED:     "true"
      #     TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
      #     TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
