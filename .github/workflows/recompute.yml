name: ATLAS 지표·퀀트 재계산 (수동)

# 외부 수집 없이 기존 prices_daily만으로 indicators_daily → quant_scores 재계산.
# Decimal 경계 수정 검증·복구용. workflow_dispatch로만 실행.

on:
  workflow_dispatch:

jobs:
  recompute:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.12 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 재계산 실행 (prices_daily → indicators → quant)
        env:
          DB_HOST:     aws-1-ap-northeast-2.pooler.supabase.com
          DB_PORT:     "6543"
          DB_USER:     postgres.dpegnpmzgozvcvbqmnlt
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME:     postgres
        run: python -m src.recompute
